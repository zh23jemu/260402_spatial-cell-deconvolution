[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-cell-deconvolution"
version = "0.1.0"
description = "空间转录组细胞解卷积课程原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.12",
  "h5py>=3.16",
  "matplotlib>=3.10",
  "numpy>=2.4",
  "pandas>=2.3",
  "scikit-learn>=1.8",
  "scipy>=1.17",
  "torch>=2.11",
  "tqdm>=4.67"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
